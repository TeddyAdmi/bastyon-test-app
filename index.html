<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ Игра - Bastyon</title>
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px 10px;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 24px 16px;
      max-width: 400px;
      margin: 0 auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 1px solid #333;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    button.btn-main {
      background-color: #f39c12;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-main:hover {
      background-color: #d35400;
    }
    .profile-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .avatar-img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #f39c12;
    }
    .avatar-letter {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: #ffffff;
      font-size: 28px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ffffff;
    }
    .user-name {
      font-size: 16px;
      font-weight: bold;
      margin: 0;
    }
    .wallet-address {
      font-size: 10px;
      color: #888888;
      word-break: break-all;
      margin: 0;
    }
    .balance-badge {
      background: #27ae60;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      margin-top: 4px;
    }
    
    /* Стили для игры КНБ */
    .game-section {
      border-top: 1px solid #333;
      padding-top: 16px;
      margin-top: 16px;
    }
    .score-board {
      display: flex;
      justify-content: space-around;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: bold;
      font-size: 14px;
    }
    .choices {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .choice-btn {
      background: #2a2a2a;
      border: 2px solid #444;
      border-radius: 12px;
      font-size: 32px;
      padding: 12px;
      cursor: pointer;
      width: 70px;
      height: 70px;
      transition: transform 0.1s, border-color 0.2s;
    }
    .choice-btn:hover {
      transform: scale(1.08);
      border-color: #f39c12;
    }
    .result-box {
      min-height: 50px;
      font-size: 15px;
      font-weight: bold;
      color: #f39c12;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎮 Игра «КНБ»</h1>
    <p id="status">Инициализация SDK...</p>
    
    <button id="connectBtn" class="btn-main" style="display: none;">Подключить профиль</button>

    <!-- Профиль пользователя -->
    <div id="profile" class="profile-container" style="display: none;">
      <div id="avatarContainer"></div>
      <p id="userName" class="user-name"></p>
      <p id="userAddress" class="wallet-address"></p>
      <div id="userBalance" class="balance-badge">0.0000 PKOIN</div>
    </div>

    <!-- Игровое поле КНБ -->
    <div id="gameSection" class="game-section" style="display: none;">
      <div class="score-board">
        <div>Вы: <span id="playerScore" style="color: #2ecc71;">0</span></div>
        <div>Бот: <span id="botScore" style="color: #e74c3c;">0</span></div>
      </div>

      <p style="font-size: 14px; color: #ccc;">Сделайте ваш выбор:</p>
      <div class="choices">
        <button class="choice-btn" onclick="playGame('rock')">✊</button>
        <button class="choice-btn" onclick="playGame('paper')">✋</button>
        <button class="choice-btn" onclick="playGame('scissors')">✌️</button>
      </div>

      <div id="result" class="result-box">Выберите фигуру для начала игры</div>
    </div>
  </div>

  <script>
    let sdk = null;
    let playerScore = 0;
    let botScore = 0;

    // Вспомогательная функция расчёта баланса
    function parseBalance(balanceData) {
      let val = 0;
      if (typeof balanceData === 'number') val = balanceData;
      else if (typeof balanceData === 'string') val = parseFloat(balanceData) || 0;
      else if (balanceData && typeof balanceData === 'object') {
        if ('balance' in balanceData) val = balanceData.balance;
        else if ('temp' in balanceData) val = balanceData.temp;
        else if (Array.isArray(balanceData) && balanceData.length > 0) {
          val = balanceData[0].balance || 0;
        }
      }
      return (Number(val) || 0).toFixed(4);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const statusEl = document.getElementById('status');
      const connectBtn = document.getElementById('connectBtn');
      const profileEl = document.getElementById('profile');
      const gameSection = document.getElementById('gameSection');

      try {
        sdk = new window.BastyonSdk();
        await sdk.init();
        sdk.emit('loaded');
        
        statusEl.innerText = 'Нажмите для подключения';
        connectBtn.style.display = 'inline-block';
      } catch (e) {
        statusEl.innerText = 'Ошибка инициализации SDK';
        console.error(e);
      }

      connectBtn.addEventListener('click', async () => {
        try {
          statusEl.innerText = 'Загрузка профиля...';
          
          const account = await sdk.get.account();
          const rawBalance = await sdk.get.balance();

          if (account) {
            statusEl.style.display = 'none';
            connectBtn.style.display = 'none';

            const address = account.address || (typeof account === 'string' ? account : 'Неизвестный адрес');
            const name = account.name || 'Пользователь Bastyon';
            const pkoinAmount = parseBalance(rawBalance);

            // Аватар
            const avatarContainer = document.getElementById('avatarContainer');
            if (account.avatar && account.avatar.length > 5) {
              avatarContainer.innerHTML = `<img class="avatar-img" src="${account.avatar}" alt="Avatar">`;
            } else {
              const firstLetter = name.charAt(0).toUpperCase() || 'U';
              avatarContainer.innerHTML = `<div class="avatar-letter">${firstLetter}</div>`;
            }

            document.getElementById('userName').innerText = name;
            document.getElementById('userAddress').innerText = address;
            document.getElementById('userBalance').innerText = `${pkoinAmount} PKOIN`;

            profileEl.style.display = 'flex';
            gameSection.style.display = 'block';
          } else {
            statusEl.innerText = 'Не удалось получить данные';
          }
        } catch (err) {
          statusEl.innerText = 'Ошибка получения профиля';
          console.error(err);
        }
      });
    });

    // Логика игры
    function playGame(playerChoice) {
      const choices = ['rock', 'paper', 'scissors'];
      const icons = { rock: '✊', paper: '✋', scissors: '✌️' };
      const botChoice = choices[Math.floor(Math.random() * choices.length)];
      
      const resultEl = document.getElementById('result');

      if (playerChoice === botChoice) {
        resultEl.innerHTML = `Ничья! <br>Вы: ${icons[playerChoice]} vs Бот: ${icons[botChoice]}`;
        resultEl.style.color = '#f1c40f';
      } else if (
        (playerChoice === 'rock' && botChoice === 'scissors') ||
        (playerChoice === 'paper' && botChoice === 'rock') ||
        (playerChoice === 'scissors' && botChoice === 'paper')
      ) {
        playerScore++;
        document.getElementById('playerScore').innerText = playerScore;
        resultEl.innerHTML = `Вы выиграли! 🎉<br>Вы: ${icons[playerChoice]} vs Бот: ${icons[botChoice]}`;
        resultEl.style.color = '#2ecc71';
      } else {
        botScore++;
        document.getElementById('botScore').innerText = botScore;
        resultEl.innerHTML = `Бот выиграл! 🤖<br>Вы: ${icons[playerChoice]} vs Бот: ${icons[botChoice]}`;
        resultEl.style.color = '#e74c3c';
      }
    }
  </script>
</body>
</html>
