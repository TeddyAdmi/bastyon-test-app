<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ Игра - Bastyon</title>
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #1a1a1a;
      color: #ffffff;
    }
    .card {
      background: #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      max-width: 380px;
      margin: 0 auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    button {
      background-color: #f39c12;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background-color: #d35400;
    }
    .profile-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 15px;
      gap: 10px;
    }
    /* Стили для аватара-картинки */
    .avatar-img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #f39c12;
    }
    /* Стили для текстового аватара (буква имени), как в Bastyon */
    .avatar-letter {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: #ffffff;
      font-size: 32px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .user-name {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      margin: 0;
    }
    .wallet-address {
      font-size: 11px;
      color: #888888;
      word-break: break-all;
      margin: 0;
    }
    .balance-badge {
      background: #27ae60;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎮 Игра КНБ</h1>
    <p id="status">Инициализация SDK...</p>
    
    <button id="connectBtn" style="display: none;">Подключить профиль</button>

    <div id="profile" class="profile-container" style="display: none;">
      <!-- Контейнер аватара: сюда подставим картинку или букву -->
      <div id="avatarContainer"></div>

      <p id="userName" class="user-name"></p>
      <p id="userAddress" class="wallet-address"></p>
      <div id="userBalance" class="balance-badge">0 PKOIN</div>
    </div>
  </div>

  <script>
    let sdk = null;

    // Вспомогательная функция разбора баланса
    function parseBalance(balanceData) {
      if (typeof balanceData === 'number') return balanceData;
      if (typeof balanceData === 'string') return parseFloat(balanceData) || 0;
      if (balanceData && typeof balanceData === 'object') {
        if ('balance' in balanceData) return balanceData.balance;
        if ('temp' in balanceData) return balanceData.temp;
        if (Array.isArray(balanceData) && balanceData.length > 0) {
          return balanceData[0].balance || 0;
        }
      }
      return 0;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const statusEl = document.getElementById('status');
      const connectBtn = document.getElementById('connectBtn');
      const profileEl = document.getElementById('profile');

      try {
        sdk = new window.BastyonSdk();
        await sdk.init();
        sdk.emit('loaded');
        
        statusEl.innerText = 'Готово к подключению';
        connectBtn.style.display = 'inline-block';
      } catch (e) {
        statusEl.innerText = 'Ошибка инициализации SDK';
        console.error(e);
      }

      connectBtn.addEventListener('click', async () => {
        try {
          statusEl.innerText = 'Загрузка профиля...';
          
          // 1. Данные аккаунта
          const account = await sdk.get.account();
          // 2. Баланс
          const rawBalance = await sdk.get.balance();

          if (account) {
            statusEl.style.display = 'none';
            connectBtn.style.display = 'none';

            // Адрес и Имя
            const address = account.address || (typeof account === 'string' ? account : 'Неизвестный адрес');
            const name = account.name || 'Пользователь Bastyon';
            
            // Расчет баланса
            const pkoinAmount = parseBalance(rawBalance);

            // Отрисовка Аватара (Картинка или Буква)
            const avatarContainer = document.getElementById('avatarContainer');
            if (account.avatar && account.avatar.length > 5) {
              avatarContainer.innerHTML = `<img class="avatar-img" src="${account.avatar}" alt="Avatar">`;
            } else {
              const firstLetter = name.charAt(0).toUpperCase() || 'U';
              avatarContainer.innerHTML = `<div class="avatar-letter">${firstLetter}</div>`;
            }

            document.getElementById('userName').innerText = name;
            document.getElementById('userAddress').innerText = address;
            document.getElementById('userBalance').innerText = `${pkoinAmount} PKOIN`;

            profileEl.style.display = 'flex';
          } else {
            statusEl.innerText = 'Не удалось получить данные';
          }
        } catch (err) {
          statusEl.innerText = 'Ошибка получения профиля';
          console.error(err);
        }
      });
    });
  </script>
</body>
</html>
