<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ PKOIN - Bastyon</title>
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px 10px;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 24px 16px;
      max-width: 400px;
      margin: 0 auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 1px solid #333;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #f39c12;
    }
    button.btn-main {
      background-color: #f39c12;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-main:hover {
      background-color: #d35400;
    }
    .profile-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .avatar-img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #f39c12;
    }
    .avatar-letter {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: #ffffff;
      font-size: 28px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ffffff;
    }
    .user-name {
      font-size: 16px;
      font-weight: bold;
      margin: 0;
    }
    .wallet-address {
      font-size: 10px;
      color: #888888;
      word-break: break-all;
      margin: 0;
    }
    .balance-badge {
      background: #27ae60;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      margin-top: 4px;
    }
    
    /* Стили для реальной игры на ставки */
    .game-section {
      border-top: 1px solid #333;
      padding-top: 16px;
      margin-top: 16px;
    }
    .bet-container {
      margin-bottom: 15px;
      background: #2a2a2a;
      padding: 12px;
      border-radius: 10px;
    }
    .bet-container label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }
    .bet-input {
      width: 100px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #121212;
      color: #fff;
      font-size: 16px;
      text-align: center;
      font-weight: bold;
    }
    .choices {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .choice-btn {
      background: #2a2a2a;
      border: 2px solid #444;
      border-radius: 12px;
      font-size: 32px;
      padding: 12px;
      cursor: pointer;
      width: 70px;
      height: 70px;
      transition: transform 0.1s, border-color 0.2s;
    }
    .choice-btn:hover {
      transform: scale(1.08);
      border-color: #f39c12;
    }
    .choice-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .result-box {
      min-height: 50px;
      font-size: 14px;
      font-weight: bold;
      color: #f39c12;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎮 Игра «КНБ» (PKOIN)</h1>
    <p id="status">Инициализация Bastyon SDK...</p>
    
    <button id="connectBtn" class="btn-main" style="display: none;">Подключить кошелек Bastyon</button>

    <!-- Профиль пользователя -->
    <div id="profile" class="profile-container" style="display: none;">
      <div id="avatarContainer"></div>
      <p id="userName" class="user-name"></p>
      <p id="userAddress" class="wallet-address"></p>
      <div id="userBalance" class="balance-badge">0.0000 PKOIN</div>
    </div>

    <!-- Игровой блок с реальными ставками -->
    <div id="gameSection" class="game-section" style="display: none;">
      
      <div class="bet-container">
        <label for="betAmount">Размер ставки (PKOIN):</label>
        <input type="number" id="betAmount" class="bet-input" value="0.1" step="0.1" min="0.05">
      </div>

      <p style="font-size: 13px; color: #ccc;">Выберите ход (вызовется кошелек):</p>
      <div class="choices">
        <button class="choice-btn" onclick="makeRealBet('rock')">✊</button>
        <button class="choice-btn" onclick="makeRealBet('paper')">✋</button>
        <button class="choice-btn" onclick="makeRealBet('scissors')">✌️</button>
      </div>

      <div id="result" class="result-box">Сделайте выбор для начала раунда</div>
    </div>
  </div>

  <script>
    let sdk = null;
    let currentUserAddress = "";
    let currentBalanceNum = 0;

    // Вспомогательный класс парсинга баланса
    function parseBalance(balanceData) {
      let val = 0;
      if (typeof balanceData === 'number') val = balanceData;
      else if (typeof balanceData === 'string') val = parseFloat(balanceData) || 0;
      else if (balanceData && typeof balanceData === 'object') {
        if ('balance' in balanceData) val = balanceData.balance;
        else if ('temp' in balanceData) val = balanceData.temp;
        else if (Array.isArray(balanceData) && balanceData.length > 0) {
          val = balanceData[0].balance || 0;
        }
      }
      return Number(val) || 0;
    }

    // Обновление баланса на экране
    async function refreshBalance() {
      try {
        const rawBalance = await sdk.get.balance();
        currentBalanceNum = parseBalance(rawBalance);
        document.getElementById('userBalance').innerText = `${currentBalanceNum.toFixed(4)} PKOIN`;
      } catch (e) {
        console.error("Ошибка обновления баланса", e);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const statusEl = document.getElementById('status');
      const connectBtn = document.getElementById('connectBtn');
      const profileEl = document.getElementById('profile');
      const gameSection = document.getElementById('gameSection');

      try {
        sdk = new window.BastyonSdk();
        await sdk.init();
        sdk.emit('loaded');
        
        statusEl.innerText = 'Кошелек готов';
        connectBtn.style.display = 'inline-block';
      } catch (e) {
        statusEl.innerText = 'Ошибка инициализации Bastyon SDK';
        console.error(e);
      }

      connectBtn.addEventListener('click', async () => {
        try {
          statusEl.innerText = 'Запрос доступа к кошельку...';
          
          const account = await sdk.get.account();

          if (account) {
            statusEl.style.display = 'none';
            connectBtn.style.display = 'none';

            currentUserAddress = account.address || (typeof account === 'string' ? account : '');
            const name = account.name || 'Пользователь Bastyon';

            // Отображение аватарки/буквы
            const avatarContainer = document.getElementById('avatarContainer');
            if (account.avatar && account.avatar.length > 5) {
              avatarContainer.innerHTML = `<img class="avatar-img" src="${account.avatar}" alt="Avatar">`;
            } else {
              const firstLetter = name.charAt(0).toUpperCase() || 'B';
              avatarContainer.innerHTML = `<div class="avatar-letter">${firstLetter}</div>`;
            }

            document.getElementById('userName').innerText = name;
            document.getElementById('userAddress').innerText = currentUserAddress;

            await refreshBalance();

            profileEl.style.display = 'flex';
            gameSection.style.display = 'block';
          } else {
            statusEl.innerText = 'Не удалось получить доступ к аккаунту';
          }
        } catch (err) {
          statusEl.innerText = 'Ошибка подключения';
          console.error(err);
        }
      });
    });

    // Функция проведения РЕАЛЬНОЙ ставки через Bastyon Payment SDK
    async function makeRealBet(playerChoice) {
      const betInput = document.getElementById('betAmount');
      const betAmount = parseFloat(betInput.value);
      const resultEl = document.getElementById('result');

      if (isNaN(betAmount) || betAmount <= 0) {
        resultEl.innerHTML = "<span style='color: #e74c3c;'>Укажите корректный размер ставки!</span>";
        return;
      }

      if (betAmount > currentBalanceNum) {
        resultEl.innerHTML = "<span style='color: #e74c3c;'>Недостаточно PKOIN на балансе!</span>";
        return;
      }

      // Блокируем кнопки на время транзакции
      toggleButtons(true);
      resultEl.innerHTML = "⏳ Ожидание подтверждения транзакции в кошельке Bastyon...";

      try {
        // Вызываем НАСТОЯЩИЙ интерфейс оплаты кошелька Bastyon
        const paymentResult = await sdk.payment({
          address: currentUserAddress, // В тестовых целях отправляем на свой адрес (или адрес dApp)
          amount: betAmount,
          message: `Ставка в игре КНБ: ${playerChoice}`
        });

        console.log("Транзакция отправлена:", paymentResult);

        // Если кошелек подтвердил транзакцию — играем раунд
        resultEl.innerHTML = "✅ Транзакция принята! Бот делает ход...";
        
        setTimeout(() => {
          resolveRound(playerChoice, betAmount, paymentResult?.txid || 'подтверждено');
          refreshBalance();
          toggleButtons(false);
        }, 1200);

      } catch (err) {
        console.error("Ошибка транзакции:", err);
        resultEl.innerHTML = "<span style='color: #e74c3c;'>Транзакция отменена или отклонена кошельком.</span>";
        toggleButtons(false);
      }
    }

    // Подведение итогов раунда после оплаты
    function resolveRound(playerChoice, betAmount, txid) {
      const choices = ['rock', 'paper', 'scissors'];
      const icons = { rock: '✊', paper: '✋', scissors: '✌️' };
      const botChoice = choices[Math.floor(Math.random() * choices.length)];
      
      const resultEl = document.getElementById('result');

      if (playerChoice === botChoice) {
        resultEl.innerHTML = `Ничья! 🤝<br>Вы: ${icons[playerChoice]} vs Бот: ${icons[botChoice]}<br><small style="color:#aaa;">Ставка ${betAmount} PKOIN возвращена.</small>`;
        resultEl.style.color = '#f1c40f';
      } else if (
        (playerChoice === 'rock' && botChoice === 'scissors') ||
        (playerChoice === 'paper' && botChoice === 'rock') ||
        (playerChoice === 'scissors' && botChoice === 'paper')
      ) {
        const winAmount = (betAmount * 2).toFixed(4);
        resultEl.innerHTML = `ВЫ ВЫИГРАЛИ! 🎉<br>Вы: ${icons[playerChoice]} vs Бот: ${icons[botChoice]}<br>Выигрыш: <strong>+${winAmount} PKOIN</strong>`;
        resultEl.style.color = '#2ecc71';
      } else {
        resultEl.innerHTML = `БОТ ВЫИГРАЛ 🤖<br>Вы: ${icons[playerChoice]} vs Бот: ${icons[botChoice]}<br>Потеряно: <strong>-${betAmount} PKOIN</strong>`;
        resultEl.style.color = '#e74c3c';
      }
    }

    function toggleButtons(disabled) {
      const buttons = document.querySelectorAll('.choice-btn');
      buttons.forEach(btn => btn.disabled = disabled);
    }
  </script>
</body>
</html>
