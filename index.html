<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ Игра - Bastyon</title>
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #1a1a1a;
      color: #ffffff;
    }
    .card {
      background: #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      max-width: 380px;
      margin: 0 auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    button {
      background-color: #f39c12;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background-color: #d35400;
    }
    .profile-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 15px;
      gap: 10px;
    }
    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #f39c12;
      background-color: #333;
    }
    .user-name {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      margin: 0;
    }
    .wallet-address {
      font-size: 11px;
      color: #888888;
      word-break: break-all;
      margin: 0;
    }
    .balance-badge {
      background: #27ae60;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎮 Игра КНБ</h1>
    <p id="status">Инициализация SDK...</p>
    
    <button id="connectBtn" style="display: none;">Подключить профиль</button>

    <div id="profile" class="profile-container" style="display: none;">
      <img id="userAvatar" class="avatar" src="" alt="Avatar">
      <p id="userName" class="user-name"></p>
      <p id="userAddress" class="wallet-address"></p>
      <div id="userBalance" class="balance-badge">0 PKOIN</div>
    </div>
  </div>

  <script>
    let sdk = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const statusEl = document.getElementById('status');
      const connectBtn = document.getElementById('connectBtn');
      const profileEl = document.getElementById('profile');

      try {
        sdk = new window.BastyonSdk();
        await sdk.init();
        sdk.emit('loaded');
        
        statusEl.innerText = 'Готово к подключению';
        connectBtn.style.display = 'inline-block';
      } catch (e) {
        statusEl.innerText = 'Ошибка инициализации SDK';
        console.error(e);
      }

      connectBtn.addEventListener('click', async () => {
        try {
          statusEl.innerText = 'Загрузка профиля...';
          
          // 1. Получаем данные аккаунта (имя, адрес, аватар)
          const account = await sdk.get.account();
          
          // 2. Получаем баланс пользователя
          const balance = await sdk.get.balance();

          if (account) {
            statusEl.style.display = 'none';
            connectBtn.style.display = 'none';

            // Извлекаем адрес и имя
            const address = account.address || account;
            const name = account.name || 'Пользователь Bastyon';
            const avatarUrl = account.avatar || 'https://bastyon.com/img/user_icon.png';

            // Извлекаем баланс в монетах PKOIN
            const pkoinAmount = (balance && balance.balance) ? balance.balance : (balance || 0);

            // Отображаем на странице
            document.getElementById('userAvatar').src = avatarUrl;
            document.getElementById('userName').innerText = name;
            document.getElementById('userAddress').innerText = address;
            document.getElementById('userBalance').innerText = `${pkoinAmount} PKOIN`;

            profileEl.style.display = 'flex';
          } else {
            statusEl.innerText = 'Не удалось получить данные';
          }
        } catch (err) {
          statusEl.innerText = 'Ошибка получения профиля';
          console.error(err);
        }
      });
    });
  </script>
</body>
</html>
